# REVIEW CANDIDATE: /etc/systemd/user/rocky-eng-worker.service.d/50-engbox-hardening.conf
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=3

[Service]
ExecStart=
ExecStart=/usr/bin/python3 -E -s -B -u /opt/rocky-eng/execworker.py
SELinuxContext=unconfined_u:unconfined_r:engbox_worker_t:s0-s0:c0.c1023
Environment=TMPDIR=/home/rocky-eng-worker/.local/share/rocky-mcp-gateway/tmp
Environment=PATH=/usr/bin:/bin
UnsetEnvironment=LD_PRELOAD LD_LIBRARY_PATH CONTAINER_HOST CONTAINER_CONNECTION DOCKER_HOST
UnsetEnvironment=CONTAINERS_CONF CONTAINERS_CONF_OVERRIDE CONTAINERS_STORAGE_CONF
UnsetEnvironment=STORAGE_DRIVER STORAGE_OPTS XDG_CONFIG_HOME XDG_DATA_HOME PYTHONUSERBASE
Restart=no
TasksAccounting=yes
MemoryAccounting=yes
CPUAccounting=yes
LimitCORE=0
LimitNOFILE=4096
# Preserve UID-map helper privileges: do not add service-level NoNewPrivileges,
# an empty capability bounding set, RestrictSUIDSGID or PrivateUsers here.
# Boot availability is enrolled separately by the reviewed site activation step.
